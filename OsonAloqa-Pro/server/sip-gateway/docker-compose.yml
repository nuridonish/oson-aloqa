version: "3"
services:
  asterisk:
    image: andrius/asterisk
    container_name: osonaloqa-pbx
    ports:
      - "5060:5060/udp"
      - "10000-10100:10000-10100/udp"
    volumes:
      - ./conf/pjsip.conf:/etc/asterisk/pjsip.conf
      - ./conf/extensions.conf:/etc/asterisk/extensions.conf
    restart: unless-stopped
