; ===== Oson Aloqa SIP gateway (Asterisk PJSIP) =====
; 1) SIP-аккаунт барои барнома (дар Profile → SIP ворид кунед)

[oson-app](endpoint-template!)
type=endpoint
context=from-app
disallow=all
allow=opus,ulaw,alaw
auth=oson-app
aors=oson-app

[oson-app](auth-template!)
type=auth
auth_type=userpass
username=oson-app
password=ПАРОЛИ_ҚАВӢ_ИҶОЗ

[oson-app](aor-template!)
type=aor
max_contacts=2

; 2) TRUNK — алоқа бо оператори телефонӣ (Twilio/Telnyx/маҳаллӣ)
; Мисол бо Twilio:
[twilio]
type=endpoint
context=from-trunk
disallow=all
allow=ulaw
auth=twilio-auth
aors=twilio
from_domain=penguin.example.twilio.com

[twilio-auth]
type=auth
auth_type=userpass
username=TWILIO_SIP_USER
password=TWILIO_SIP_PASS

[twilio]
type=aor
contact=sip:TWILIO_TERMINAL.penguin.example.twilio.com

; ===== ЗАҲИРАҲО (dialplan) =====
[from-app]
; занг ба ҳамаи рақамҳо → тавассути trunk
exten => _X.,1,Dial(PJSIP/${EXTEN}@twilio,60)
 same => n,Hangup()

[from-trunk]
; зангҳои воридшуда аз trunk → SIP-и барнома
exten => s,1,Dial(PJSIP/oson-app,60)
 same => n,Hangup()
